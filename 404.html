<style>
:root {
  --bg: #0e0e10;
  --surface: #18181b;
  --border: #2e2e33;
  --text: #fafafa;
  --text-2: #a1a1aa;
  --text-3: #71717a;
  --accent: #22d3ee;
  --accent-dim: rgba(34,211,238,0.08);
  --radius: 14px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Syne', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(34,211,238,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,211,238,0.03) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
}
.wrap {
  position: relative;
  z-index: 1;
  max-width: 560px;
  width: 100%;
  padding: 48px 24px;
  text-align: center;
}
.code {
  font-family: 'DM Mono', monospace;
  font-size: 96px;
  font-weight: 500;
  color: var(--accent);
  line-height: 1;
  opacity: 0.6;
  margin-bottom: 24px;
}
h1 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 12px;
}
p {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  color: var(--text-3);
  line-height: 1.7;
  margin-bottom: 36px;
}
.links {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn {
  display: inline-block;
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  letter-spacing: 0.06em;
  padding: 12px 24px;
  border-radius: 8px;
  text-decoration: none;
  transition: background 0.2s, color 0.2s;
}
.btn-primary {
  background: var(--accent-dim);
  border: 1px solid rgba(34,211,238,0.3);
  color: var(--accent);
}
.btn-primary:hover { background: rgba(34,211,238,0.15); }
.btn-secondary {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-2);
}
.btn-secondary:hover { border-color: rgba(34,211,238,0.3); color: var(--text); }
.site-footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--text-3);
  background: var(--bg);
}
.site-footer a { color: var(--text-3); text-decoration: none; transition: color 0.2s; }
.site-footer a:hover { color: var(--accent); }
.sf-sep { display: inline-block; width: 18px; }
